global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Node.js Application ─────────────────────────
  - job_name: 'booking-tour-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'

  # ── cAdvisor - Docker container metrics ─────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  # ── Node Exporter - Host system metrics ─────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ── PostgreSQL Exporter ──────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ── Nginx Exporter ───────────────────────────────
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
