services:

  # ╔══════════════════════════════════════╗
  # ║     DATABASE LAYER                   ║
  # ╚══════════════════════════════════════╝
  postgres:
    image: postgres:15-alpine
    container_name: booking-tour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Hardening: no external port exposure
    # Hardening: resource limits
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: booking-tour-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.3'

  # ╔══════════════════════════════════════╗
  # ║     APPLICATION LAYER                ║
  # ╚══════════════════════════════════════╝
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: booking-tour-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    # Hardening: non-root user already set in Dockerfile
    # Hardening: resource limits
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ╔══════════════════════════════════════╗
  # ║     REVERSE PROXY                    ║
  # ╚══════════════════════════════════════╝
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: booking-tour-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    depends_on:
      - app
      - grafana
      - pgadmin
    volumes:
      - nginx_logs:/var/log/nginx
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.2'

  # ╔══════════════════════════════════════╗
  # ║     MONITORING STACK                 ║
  # ╚══════════════════════════════════════╝
  prometheus:
    image: prom/prometheus:latest
    container_name: booking-tour-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - backend
    # Hardening: non-root
    user: "65534:65534"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  grafana:
    image: grafana/grafana:latest
    container_name: booking-tour-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://%(domain)s/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - frontend
      - monitoring
    depends_on:
      - prometheus
    # Hardening: non-root
    user: "472:472"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.3'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: booking-tour-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    privileged: true
    devices:
      - /dev/kmsg

  node-exporter:
    image: prom/node-exporter:latest
    container_name: booking-tour-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    # Hardening: non-root
    user: "65534:65534"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: booking-tour-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_ADMIN_USER}:${DB_ADMIN_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    networks:
      - monitoring
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: booking-tour-nginx-exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://nginx/stub_status'
    networks:
      - monitoring
      - frontend
    depends_on:
      - nginx

  # ╔══════════════════════════════════════╗
  # ║     LOGGING STACK                    ║
  # ╚══════════════════════════════════════╝
  loki:
    image: grafana/loki:latest
    container_name: booking-tour-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    # Hardening: non-root
    user: "10001:10001"

  promtail:
    image: grafana/promtail:latest
    container_name: booking-tour-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - monitoring
    depends_on:
      - loki

# ╔══════════════════════════════════════════╗
# ║     NETWORKS (isolation - hardening)     ║
# ╚══════════════════════════════════════════╝
networks:
  frontend:
    driver: bridge
    name: tourviet_frontend
  backend:
    driver: bridge
    name: tourviet_backend
    internal: true        # No external access (hardening)
  monitoring:
    driver: bridge
    name: tourviet_monitoring
    internal: true        # No external access (hardening)

# ╔══════════════════════════════════════╗
# ║     VOLUMES                          ║
# ╚══════════════════════════════════════╝
volumes:
  postgres_data:
    name: tourviet_postgres_data
  pgadmin_data:
    name: tourviet_pgadmin_data
  grafana_data:
    name: tourviet_grafana_data
  prometheus_data:
    name: tourviet_prometheus_data
  loki_data:
    name: tourviet_loki_data
  nginx_logs:
    name: tourviet_nginx_logs
