worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    client_max_body_size 10M;
    server_tokens off;  # Hide nginx version (hardening)

    # ── Rate limiting (hardening) ──────────────────
    limit_req_zone $binary_remote_addr zone=app:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ── WebSocket upgrade map ──────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── Upstream definitions ───────────────────────
    upstream app_backend {
        server app:3000;
        keepalive 16;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    upstream pgadmin_backend {
        server pgadmin:80;
    }

    # ── HTTP Server (Redirect & Internal Metrics) ──
    server {
        listen 80;
        server_name _;

        # Internal stub_status for nginx-prometheus-exporter
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # HTTP → HTTPS redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ──────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL configuration (self-signed for dev)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers (hardening) ───────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # ── App routes ─────────────────────────────
        location / {
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; script-src 'self' 'unsafe-inline';" always;
            limit_req zone=app burst=10 nodelay;
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # ── Grafana ────────────────────────────────
        location ^~ /grafana/ {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── pgAdmin ────────────────────────────────
        location ^~ /pgadmin/ {
            proxy_pass http://pgadmin_backend/;
            proxy_http_version 1.1;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Nginx stub_status for Prometheus Exporter ──
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ── Prometheus metrics endpoint (restrict access) ──
        location /prometheus/ {
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://prometheus:9090/;
        }

        # ── Static file caching ────────────────────
        location ~* ^/(css|js|images|fonts)/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://app_backend;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}
